
name: Tourism Project Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: write


jobs:

  # ========================================================
  # JOB 1: Register Dataset
  # ========================================================

  register-dataset:

    name: Register Dataset

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/deployment/requirements.txt
          pip install mlflow


      - name: Register Dataset
        run: |
          python tourism_project/model_building/data_register.py


      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv


  # ========================================================
  # JOB 2: Data Preparation
  # ========================================================

  data-preparation:

    name: Data Preparation

    needs: register-dataset

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/deployment/requirements.txt


      - name: Prepare Data
        run: |
          python tourism_project/model_building/prep.py


      - name: Check Generated Files
        run: |
          ls -lh tourism_project/model_building/


      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            tourism_project/model_building/Xtrain.csv
            tourism_project/model_building/Xtest.csv
            tourism_project/model_building/ytrain.csv
            tourism_project/model_building/ytest.csv


  # ========================================================
  # JOB 3: Model Training
  # ========================================================

  model-training:

    name: Model Training

    needs: data-preparation

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/deployment/requirements.txt
          pip install mlflow


      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project/model_building


      - name: Check Downloaded Files
        run: |
          ls -lh tourism_project/model_building/


      - name: Start MLflow Server
        run: |
          nohup mlflow ui \
            --host 0.0.0.0 \
            --port 5000 > mlflow.log 2>&1 &

          sleep 5


      - name: Train Model
        run: |
          python tourism_project/model_building/train.py


      - name: Check Trained Model
        run: |
          ls -lh tourism_project/deployment/


      - name: Commit Trained Model
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add \
            tourism_project/deployment/best_tourism_model_v1.joblib

          git commit \
            -m "Add trained tourism model [skip ci]" \
            || echo "No changes to commit"

          git push
